name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Collect APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk SubTimer.apk

      - name: Collect failure log
        if: failure()
        run: |
          tail -n 3000 build.log > fail.log || true
          grep -n -i -E "e: |error:|Unresolved|Could not|FAILURE" build.log | tail -n 200 > errors.log || true

      - name: Publish APK release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: SubTimer v1.${{ github.run_number }}
          body: |
            自动构建（debug 签名，可直接安装）。用法见 README。
          files: SubTimer.apk

      - name: Publish log release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: build-log-${{ github.run_number }}
          body: 构建失败，附编译日志
          files: |
            errors.log
            fail.log
