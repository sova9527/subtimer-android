name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark
        run: |
          { echo "run=${{ github.run_number }}"; echo "java_home_17=$JAVA_HOME_17_X64"; echo "android_home=$ANDROID_HOME"; uname -a; } > ci-mark.txt 2>&1 || true

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          bash -x ci/run.sh 2>&1 | tee build.log

      - name: Collect APK
        if: steps.build.outcome == 'success'
        run: cp app/build/outputs/apk/debug/app-debug.apk SubTimer.apk

      - name: Publish APK
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: SubTimer v1.${{ github.run_number }}
          body: |
            自动构建（debug 签名，可直接安装）。用法见 README。
          files: SubTimer.apk

      - name: Upload logs
        if: always()
        run: |
          tail -n 8000 build.log > ci-logs-build.txt 2>/dev/null || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -B ci-logs
          git add -f ci-logs-build.txt ci-mark.txt build.log 2>/dev/null || true
          git commit -m "ci: log run ${{ github.run_number }}" || true
          git push -f origin ci-logs || true
